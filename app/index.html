<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>THE MERIDIAN CHALLENGE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23D8231F'/></svg>">
<style>
:root{
  --paper:#FFFFFF; --ink:#111111; --dim:#6E6E6E; --hair:#E4E4E0; --hair2:#CFCFCA;
  --red:#D8231F; --ok:#1B7F4D; --soft:#F6F6F2;

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--red)}
::selection{background:var(--red);color:#fff}
.frame{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
@media(max-width:820px){.frame{grid-template-columns:1fr}}
.rail{border-right:1px solid var(--hair);padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}
@media(max-width:820px){.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hair)}}
.mark{width:26px;height:26px;background:var(--red);margin-bottom:26px}
.rail h1{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
.rail .sub{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:26px}
.idx{list-style:none;margin:0;padding:0}
.idx a{display:flex;gap:10px;padding:7px 0;text-decoration:none;border-top:1px solid var(--hair);font-size:13.5px}
.idx a .no{font-family:var(--mono);font-size:11px;color:var(--dim);width:20px}
.idx a.on{color:var(--red);font-weight:700}
.idx a:hover{color:var(--red)}
.rail .clock{margin-top:26px;border-top:1px solid var(--hair);padding-top:16px}
.main{padding:34px 44px 90px;max-width:860px}
@media(max-width:820px){.main{padding:22px 18px 70px}}
.kicker{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
h2.big{font-size:clamp(28px,4.5vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.04;margin:0 0 8px}
.lede{font-size:17px;color:#333;max-width:60ch;margin:10px 0 0}
h3{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:30px 0 10px}
h3 .no{color:var(--red);font-family:var(--mono);margin-right:8px}
p{margin:8px 0}
.dim{color:var(--dim)} .mono{font-family:var(--mono)}
.red{color:var(--red)} .ok{color:var(--ok);font-weight:700}
.sect{border-top:1px solid var(--hair);padding:22px 0 6px;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
td,th{border-bottom:1px solid var(--hair);padding:9px 8px;text-align:left;vertical-align:top}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
input,textarea,select{width:100%;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:11px 12px;font:14px/1.4 var(--sans);margin:6px 0 14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--red);outline-offset:-1px}
button{appearance:none;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:0;padding:11px 18px;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin:6px 8px 6px 0}
button:hover{background:var(--red);border-color:var(--red)}
button.ghost{background:transparent;color:var(--ink)}
button.ghost:hover{color:var(--red);border-color:var(--red)}
button.mini{padding:6px 10px;font-size:10.5px;margin:0}
button.hero{background:var(--red);border-color:var(--red);font-size:14px;padding:16px 26px}
button.hero:hover{background:var(--ink);border-color:var(--ink)}
.bar{height:3px;background:var(--hair);margin:18px 0 8px}
.bar i{display:block;height:3px;background:var(--red)}
.timer{font-family:var(--mono);font-weight:700;font-size:40px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red)}
.card{background:var(--soft);border:1px solid var(--hair);padding:16px 18px;margin:12px 0}
.flag{font-size:11px;color:var(--dim);letter-spacing:.04em}
.tag{display:inline-block;border:1px solid var(--ink);padding:2px 9px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin:0 6px 6px 0}
.tag.red{border-color:var(--red);color:var(--red)}
.banner{border-left:3px solid var(--red);background:var(--soft);padding:12px 16px;margin:16px 0}
pre{background:var(--soft);border:1px solid var(--hair);border-left:3px solid var(--ink);padding:14px 16px;overflow-x:auto;font:13px/1.5 var(--mono);white-space:pre-wrap;margin:8px 0 4px}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);align-items:flex-start}
.step input[type=checkbox]{width:17px;height:17px;accent-color:var(--red);margin:2px 0 0;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.bignum{font-family:var(--mono);font-size:22px;font-weight:700}
.code{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--soft);border:1px dashed var(--hair2);padding:12px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:700px){.pick{grid-template-columns:1fr}}
.pick button{width:100%;text-align:left;padding:18px 16px;letter-spacing:.04em;text-transform:none;font:600 15px/1.3 var(--sans)}
.pick button.on{background:var(--red);border-color:var(--red);color:#fff}
.opt{display:block;width:100%;margin:8px 0;text-align:left;text-transform:none;letter-spacing:0;font:600 16px/1.3 var(--sans);padding:16px 18px}
.opt.on{background:var(--red);border-color:var(--red)}
.speak{border:1px dashed var(--hair2);padding:14px 16px;margin:12px 0;font-size:14px}
.stage-num{font-family:var(--mono);font-size:clamp(42px,8vw,88px);font-weight:700;letter-spacing:-.03em;line-height:.95;margin:8px 0 4px}
body.onstage .rail{display:none}
body.onstage .frame{grid-template-columns:1fr}
body.onstage .main{max-width:1100px;padding:48px 56px}
body.onstage h2.big{font-size:clamp(36px,6vw,64px)}
@media print{.rail,button{display:none!important}.frame{grid-template-columns:1fr}.main{padding:0;max-width:none}body{font-size:12px}.card{background:#fff;border:1px solid #999}}
</style>
</head>

function grade(q,v){
  const out=[];
  for(const line of (KEYS[q]||{lines:[]}).lines){
    const num=parseFloat(line.split("|")[0].replace(/,/g,""));
    if(Math.abs(v-num)/num<0.005) out.push(line);
  }
  return out;
}

function segIdx(){
  if(!S.start) return 0;
  const m=Math.floor((Date.now()-S.start)/60000);
  const A=agenda(); let i=0;
  for(let k=0;k<A.length;k++) if(m>=A[k][0]) i=k;
  return i;
}

function render(){
  if(document.body&&document.body.classList&&document.body.classList.toggle)
    document.body.classList.toggle("onstage", isStage());

  document.getElementById("idx").innerHTML=navItems().map(([r,l])=>{
    if(r==="facilitator"&&!isFac()&&!isStage()) return "";

    return `<li><a href="#${r}" class="${route===r?"on":""}"><span class="no">${parts[0]}</span>${parts.slice(1).join(" ")}</a></li>`;
  }).join("");
  if(isStage()){ document.getElementById("main").innerHTML=vStage(); renderClock(); return; }
  const pm=route.match(/^pack-(P\d)$/);

   ${S.traps.map((t,i)=>`<tr><td>${esc(t.q)}</td><td><span class="tag">${esc(t.o)}</span></td>
   <td><button class="mini ghost" onclick="S.traps.splice(${i},1);save();render()">×</button></td></tr>`).join("")}
   </table></div>`:`<p class="dim" style="margin-top:14px">Nothing pinned yet.</p>`}
  <div class="sect"><button class="ghost" onclick="exportEval()">Download my traps (JSONL)</button></div>`;
}
function addTrap(){const q=trap.value.trim();if(!q)return;S.traps.push({q,o:outcome.value});save();render()}
function exportEval(){
  const lines=S.traps.map((t,i)=>JSON.stringify({id:"CASE-"+String(9000+i).padStart(4,"0"),
    question:t.q,expected:{type:"refusal",refusal_reason:"unadjudicated"},trap_axes:["A1"],
    difficulty:"hard",outcome_at_workshop:t.o.replace(/ /g,"_"),pair_id:S.team||"unknown"}));
  dl("wall-of-pain.jsonl",lines.join("\n"));
}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click()}

function vDecide(){
  S.dec=S.dec||{};
  const d=S.dec;
  return `<p class="kicker">Decision record</p>
   <h2 class="big">Leave with owners,<br>not enthusiasm.</h2>
   <p class="lede">Strategy sessions that skip this page produce hallway agreement and Monday drift. One owner per line. Ninety days.</p>
   <div class="sect"><h3>The three ticks we will live with</h3>
    <div class="grid2">
     <div><label class="flag">CANCELLED COUNT AS REVENUE?</label>
      <select id="d1" onchange="S.d1=this.value;save()"><option ${S.d1==="NO"?"selected":""}>NO</option><option ${S.d1==="YES"?"selected":""}>YES</option></select>
      <label class="flag">RETURNS SUBTRACTED?</label>
      <select id="d2" onchange="S.d2=this.value;save()"><option ${S.d2==="YES"?"selected":""}>YES</option><option ${S.d2==="NO"?"selected":""}>NO</option></select></div>
     <div><label class="flag">DATE THAT DEFINES "WHEN"</label>
      <select id="d3" onchange="S.d3=this.value;save()"><option>ORDER DATE</option><option>INVOICE DATE</option></select>
      <p class="flag">Default that matches the envelope: NO / YES / ORDER DATE.</p></div>
    </div></div>
   <div class="sect"><h3>Who owns the metric</h3>
    <input id="own" placeholder="Name · role  e.g. Priya Shah, CFO" value="${esc(d.own||"")}"
      onchange="S.dec.own=this.value;save()"></div>
   <div class="sect"><h3>One 90-day move</h3>
    <textarea id="mv" rows="3" placeholder="e.g. Stand up a governed revenue view; no board number leaves without it."
      onchange="S.dec.mv=this.value;save()">${esc(d.mv||"")}</textarea></div>
   <div class="sect"><h3>What we will not claim</h3>
    <textarea id="nc" rows="3" placeholder="e.g. Dual-region reps are a hypothesis for delay, not a cause. Q2 vs Q1 is not the Feb policy effect."
      onchange="S.dec.nc=this.value;save()">${esc(d.nc||"")}</textarea>
    <p class="flag">Write this even if it feels pedantic. It is the difference between judgment and a new wrong answer.</p></div>
   <button onclick="saveDec();alert('Saved on this device. Hand-off code is on the scoreboard.')">Save record</button>
   <button class="ghost" onclick="dlDec()">Download one-pager</button>`;
}
function saveDec(){
  S.dec=S.dec||{};
  const own=document.getElementById("own"),mv=document.getElementById("mv"),nc=document.getElementById("nc");
  if(own) S.dec.own=own.value; if(mv) S.dec.mv=mv.value; if(nc) S.dec.nc=nc.value;
  save();
}
function dlDec(){
  saveDec();
  const t=`MERIDIAN CHALLENGE — decision record
Team: ${S.team||""}  ${S.name||""}
Ticks: cancelled=${S.d1||"?"}  returns=${S.d2||"?"}  date=${S.d3||"?"}
Metric owner: ${S.dec.own||""}
90-day move: ${S.dec.mv||""}
We will not claim: ${S.dec.nc||""}
Votes: ${JSON.stringify(S.votes||{})}
`;
  dl("meridian-decision.txt",t);
}

function vChecklist(){
  S.cl=S.cl||CHECKLIST.map(()=>false);
  return `<p class="kicker">Monday morning</p><h2 class="big">${isExec()?"Questions that protect<br>the board deck.":"The 10 questions<br>that catch bad answers."}</h2>
  <p class="lede">${isExec()?"Forward this. Use it on vendors and on your own data team.":"Use these on any AI-generated number."}</p>
  ${CHECKLIST.map((c,i)=>`<div class="step"><input type="checkbox" ${S.cl[i]?"checked":""}
    onchange="S.cl[${i}]=this.checked;save()"><div>${c}</div></div>`).join("")}
  <div class="sect"><h3>Vendor filter — 2026</h3>
   ${VENDOR.map(q=>`<p>· ${q}</p>`).join("")}
   <p class="flag">Live data or estimates. Semantic layer or guesswork. Ask or guess. Refuse or bluff. Query you can audit, or not.</p>
  </div>`;
}

function vFac(){
  const b=beatNow();
  return `<p class="kicker">Facilitator</p><h2 class="big">Run the room.</h2>
   <p class="dim">Visible because this URL carries ?f=1. Projector: add ?stage=1 (clock still needs a start here).</p>
   <div class="sect"><h3>Clock</h3>
    <button onclick="S.start=Date.now();save();render()">${S.start?"Restart":"Start"} the clock (now)</button>
    <button class="ghost" onclick="delete S.start;save();render()">Clear</button>
    <span class="flag">${S.start?"started "+new Date(S.start).toLocaleTimeString():"not started — wait for S1"}</span>
    <p class="flag">Current beat: <b>${b.k}</b> — ${b.h}. Duration follows the role of this browser (${isExec()?"90 min exec":"150 min lab"}).</p>
    <p><a href="?stage=1#stage" target="_blank">Open stage (new tab)</a></p></div>
   <div class="speak"><span class="flag">SAY THIS NOW</span><p>${b.say}</p></div>
   <div class="sect"><h3>Room pulse (you type the split after hands or phones)</h3>
    <input id="split" placeholder="e.g. board: 4 yes / 11 no / 6 depends" value="${esc(S.split||"")}"
     onchange="S.split=this.value;save()">
    <p class="flag">Mentimeter rule: the chart is the prompt, not the conclusion. Pause. Then discuss the split.</p></div>
   <div class="sect"><h3>Roster — check-ins</h3>
    <textarea id="pres" rows="2" placeholder="paste a presence code"></textarea>
    <button onclick="mergePresence()">Check in</button>
    <button class="ghost" onclick="if(confirm('clear roster?')){S.roster=[];save();render()}">Clear</button>
    <p class="flag">${(S.roster||[]).length} checked in · ${new Set((S.roster||[]).map(r=>r.team)).size} team(s)</p>
    <table><tr><th>Name</th><th>Team</th><th>Role</th></tr>
    ${(S.roster||[]).map(r=>`<tr><td>${esc(r.name||"—")}</td><td>${esc(r.team)}</td><td>${esc(r.role||"")}</td></tr>`).join("")
      ||`<tr><td colspan="3" class="dim">nobody yet</td></tr>`}</table></div>
   <div class="sect"><h3>Team scores</h3>
    <textarea id="sync" rows="3" placeholder="paste a hand-off code"></textarea>
    <button onclick="mergeSync()">Merge</button>
    <button class="ghost" onclick="if(confirm('clear board?')){S.board={};save();render()}">Clear board</button>
    <div id="board">${board()}</div></div>
   <div class="sect"><h3>Parking lot</h3>
    <textarea id="park" rows="3" placeholder="write the point, blame the timer, move on"
      onchange="S.park=this.value;save()">${esc(S.park||"")}</textarea></div>
   <div class="sect"><h3>Trap harvest</h3>
    <textarea id="wm" rows="3" placeholder="paste participant wall export (JSONL)"></textarea>
    <button onclick="mergeWall()">Append</button>
    <button class="ghost" onclick="dl('cases.jsonl',(S.eval||[]).map(j=>JSON.stringify(j)).join('\\n'))">Download cases.jsonl</button>
    <p class="flag">${(S.eval||[]).length} cases held</p></div>`;
}
function board(){
  S.board=S.board||{};
  const rows=Object.entries(S.board).map(([t,b])=>
   `<tr><td><b>${esc(t)}</b> ${b.name?`<span class="dim">${esc(b.name)}</span>`:""}</td>
    <td class="mono">${b.a1??"—"}</td><td class="mono">${b.a2??"—"}</td>
    <td class="mono dim">${esc(b.ticks||"")}</td><td class="mono dim">${esc(b.role||"")}</td></tr>`).join("");
  return `<table><tr><th>Team</th><th>Before</th><th>After</th><th>Ticks</th><th>Role</th></tr>
   ${rows||`<tr><td colspan="5" class="dim">no teams yet</td></tr>`}</table>`;
}
function mergeSync(){
  try{const d=JSON.parse(decodeURIComponent(escape(atob(sync.value.trim()))));
    S.board=S.board||{};S.board[d.team]=d;save();render();
  }catch(e){alert("unreadable code")}
}
function mergePresence(){
  try{const d=JSON.parse(decodeURIComponent(escape(atob(pres.value.trim()))));
    if(!d.pres) throw 0;
    S.roster=S.roster||[];
    if(!S.roster.some(r=>r.name===d.name&&r.team===d.team)) S.roster.push(d);
    save();render();
  }catch(e){alert("unreadable presence code")}
}
function mergeWall(){S.eval=S.eval||[];
  wm.value.split("\n").filter(Boolean).forEach(l=>{try{S.eval.push(JSON.parse(l))}catch(e){}});
  save();render()}

function curSeg(){
  if(!S.start) return {banner:`<div class="banner">The facilitator hasn't started the clock — meanwhile,
    tick the setup steps below.</div>`,name:"Before we start",desc:"",next:"",left:0,m:0};
  const m=Math.floor((Date.now()-S.start)/60000);
  const A=agenda(); let i=0; for(let k=0;k<A.length;k++) if(m>=A[k][0]) i=k;
  const nxt=A[i+1];
  return {banner:"",name:A[i][1],desc:A[i][2],
    next:nxt?`${nxt[1]} at minute ${nxt[0]}`:"we're done",left:nxt?nxt[0]-m:duration()-m,m};
}
function renderClock(){
  const el=document.getElementById("railclock"); if(!el) return;
  const seg=curSeg(); const left=duration()-seg.m;
  el.innerHTML=S.start?`
    <div class="timer ${left<20?"warn":""}">${Math.max(0,left)}′</div>
    <div class="flag">MINUTES LEFT<br><b style="color:var(--ink)">${seg.name}</b></div>
    <div class="bar"><i style="width:${Math.min(100,100*seg.m/duration())}%"></i></div>`
   :`<div class="flag">Clock not started</div>`;
}
setInterval(()=>{if(S.start)renderClock()},10000);
if(location.hash.replace("#","")==="stage") route="stage";
else if(location.hash) route=location.hash.replace("#","")||"home";
render();
</script>
</body>
</html>
